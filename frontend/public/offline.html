<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0a0a14" />
<title>Sem conexão — Uniq.chat</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a14;
    --surface: #14141f;
    --border: rgba(255,255,255,0.08);
    --text-1: #f4f4f5;
    --text-2: #a1a1aa;
    --green: #00d46a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text-1);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", system-ui, sans-serif;
    padding: 24px;
  }
  .card {
    text-align: center;
    max-width: 360px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    border-radius: 18px;
    background: rgba(0,212,106,0.08);
    border: 1px solid rgba(0,212,106,0.25);
    color: var(--green);
    margin-bottom: 18px;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 6px; }
  p  { font-size: 14px; line-height: 1.5; color: var(--text-2); margin: 0 0 20px; }
  button {
    appearance: none;
    border: 0;
    background: var(--green);
    color: #03170a;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 12px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
    </div>
    <h1>Sem conexão</h1>
    <p>Você está offline. O Uniq.chat precisa de internet pra carregar conversas em tempo real. Tente novamente assim que voltar.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
