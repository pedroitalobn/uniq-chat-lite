# ══════════════════════════════════════════════════════════════════════════════
# Uniq.chat — Nginx configuration
#
# Domains:
#   uniq.chat          → Frontend (Next.js :3010)
#   api.uniq.chat      → Backend API (:8080)
#   media.uniq.chat    → MinIO S3 (:9010)
#
# Setup:
#   1. apt install nginx certbot python3-certbot-nginx
#   2. Copy this file to /etc/nginx/sites-available/uniqchat
#   3. ln -s /etc/nginx/sites-available/uniqchat /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#   5. certbot --nginx -d uniq.chat -d api.uniq.chat -d media.uniq.chat
# ══════════════════════════════════════════════════════════════════════════════

# ── Frontend: uniq.chat ───────────────────────────────────────────────────────
server {
    listen 80;
    server_name uniq.chat www.uniq.chat;

    # Redirect www → apex
    if ($host = www.uniq.chat) {
        return 301 https://uniq.chat$request_uri;
    }

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://uniq.chat$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name uniq.chat;

    ssl_certificate     /etc/letsencrypt/live/uniq.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uniq.chat/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-Content-Type-Options    nosniff always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_comp_level 6;

    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── Backend API: api.uniq.chat ────────────────────────────────────────────────
server {
    listen 80;
    server_name api.uniq.chat;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://api.uniq.chat$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name api.uniq.chat;

    ssl_certificate     /etc/letsencrypt/live/uniq.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uniq.chat/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # CORS pre-flight
    add_header Access-Control-Allow-Origin  "https://uniq.chat" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key" always;

    client_max_body_size 64M;  # media uploads

    # WebSocket support (instance /ws endpoint)
    location ~* /ws$ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # SSE (MCP, QR streaming)
    location ~* /sse$ {
        proxy_pass          http://127.0.0.1:8080;
        proxy_http_version  1.1;
        proxy_set_header    Connection "";
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ── MinIO Media: media.uniq.chat ──────────────────────────────────────────────
server {
    listen 80;
    server_name media.uniq.chat;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://media.uniq.chat$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name media.uniq.chat;

    ssl_certificate     /etc/letsencrypt/live/uniq.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uniq.chat/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 64M;

    location / {
        proxy_pass         http://127.0.0.1:9010;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
