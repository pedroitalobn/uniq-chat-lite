services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: uniqchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uniqchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: uniqchat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniqchat"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── RabbitMQ ───────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: uniqchat-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-uniqchat}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "15672:15672"   # Management UI — feche após configurar
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ── MinIO ──────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: uniqchat-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-uniqchat}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9010:9000"   # S3 API (usado internamente pelo backend)
      - "9011:9001"   # Console UI — feche após configurar
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uniqchat-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PORT: 8080
      # Usa container_name como hostname — DNS do dokploy-network resolve por nome do container
      DATABASE_URL: postgres://uniqchat:${POSTGRES_PASSWORD}@uniqchat-postgres:5432/uniqchat?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: https://app.uniq.chat
      APP_URL: https://app.uniq.chat
      APP_NAME: Uniq.chat
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_DIR: /app/sessions
      PROXY_ENCRYPTION_KEY: ${PROXY_ENCRYPTION_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO}
      STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS}
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-uniqchat}:${RABBITMQ_PASS}@uniqchat-rabbitmq:5672/
      MINIO_ENDPOINT: uniqchat-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-uniqchat}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-uniqchat-media}
      MINIO_PUBLIC_URL: https://media.uniq.chat
      MINIO_USE_SSL: "false"
    volumes:
      - sessions_data:/app/sessions
    ports:
      - "8181:8080"
    networks:
      - dokploy-network

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* são build-time no Next.js — obrigatório passar via args
        NEXT_PUBLIC_API_URL: https://api.uniq.chat
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    container_name: uniqchat-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://app.uniq.chat
      # URL interna do backend — usada pelo auth.ts (server-side) para
      # evitar hairpin NAT via domínio externo dentro do container.
      API_URL: http://uniqchat-backend:8080
    expose:
      - "3000"
    networks:
      - dokploy-network

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  sessions_data:

# dokploy-network é a rede externa gerenciada pelo Dokploy/Traefik.
# Todos os serviços precisam estar nela para se comunicarem via DNS interno.
networks:
  dokploy-network:
    external: true
