services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: uniqchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uniqchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: uniqchat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniqchat"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── RabbitMQ ───────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: uniqchat-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-uniqchat}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "15672:15672"   # Management UI — feche após configurar
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # MinIO local foi REMOVIDO — produção usa Hetzner Object Storage
  # (gerenciado, S3-compatible). Variáveis MINIO_* no .env apontam pro
  # endpoint Hetzner. Pra reativar local: descomentar serviço, voltar
  # depends_on do backend e setar MINIO_ENDPOINT=uniqchat-minio:9000.

  # ── Instagram Bridge ───────────────────────────────────────────────────────
  instagram-bridge:
    build:
      context: ./instagram-bridge
      dockerfile: Dockerfile
    container_name: uniqchat-instagram-bridge
    restart: unless-stopped
    environment:
      INSTAGRAM_BRIDGE_PORT: 8091
      INSTAGRAM_BRIDGE_SESSIONS_DIR: /app/sessions
    volumes:
      - instagram_sessions:/app/sessions
    networks:
      - dokploy-network

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uniqchat-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      instagram-bridge:
        condition: service_started
    environment:
      PORT: 8080
      # Usa container_name como hostname — DNS do dokploy-network resolve por nome do container
      DATABASE_URL: postgres://uniqchat:${POSTGRES_PASSWORD}@uniqchat-postgres:5432/uniqchat?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: https://app.uniq.chat
      APP_URL: https://app.uniq.chat
      APP_NAME: Uniq.chat
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_DIR: /app/sessions
      PROXY_ENCRYPTION_KEY: ${PROXY_ENCRYPTION_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO}
      STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS}
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-uniqchat}:${RABBITMQ_PASS}@uniqchat-rabbitmq:5672/
      # ── Storage (Hetzner Object Storage / S3-compatible) ────────────────
      # Tudo lido do .env — sem hardcode. Aceita também Cloudflare R2,
      # AWS S3, Backblaze B2, ou MinIO self-hosted.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-true}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Admin}
      INSTAGRAM_BASE_URL: http://uniqchat-instagram-bridge:8091
      # ── Meta WhatsApp Cloud API (WABA Tech Provider) ────────────────────
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      META_WHATSAPP_CONFIG_ID: ${META_WHATSAPP_CONFIG_ID}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
    volumes:
      - sessions_data:/app/sessions
    ports:
      - "8181:8080"
    networks:
      - dokploy-network

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* são build-time no Next.js — obrigatório passar via args
        NEXT_PUBLIC_API_URL: https://api.uniq.chat
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_META_APP_ID: ${META_APP_ID}
        NEXT_PUBLIC_META_WHATSAPP_CONFIG_ID: ${META_WHATSAPP_CONFIG_ID}
    container_name: uniqchat-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://app.uniq.chat
      API_URL: http://uniqchat-backend:8080
      NEXT_PUBLIC_API_URL: https://api.uniq.chat
    expose:
      - "3000"
    networks:
      - dokploy-network

volumes:
  postgres_data:
  rabbitmq_data:
  sessions_data:
  instagram_sessions:
  # minio_data removido junto com o serviço local. Se reativar, voltar aqui.

# dokploy-network é a rede externa gerenciada pelo Dokploy/Traefik.
# Todos os serviços precisam estar nela para se comunicarem via DNS interno.
networks:
  dokploy-network:
    external: true
