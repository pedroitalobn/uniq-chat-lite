services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: uniqchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uniqchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uniqchat_secret}
      POSTGRES_DB: uniqchat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniqchat"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── RabbitMQ (fila interna de mensagens + anti-ban) ────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: uniqchat-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-uniqchat}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-uniqchat123}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI → http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ── MinIO (armazenamento de mídia) ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: uniqchat-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-uniqchat}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-uniqchat123}
    volumes:
      - minio_data:/data
    ports:
      - "9010:9000"   # S3 API
      - "9011:9001"   # Console UI → http://localhost:9011
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uniqchat-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://uniqchat:${POSTGRES_PASSWORD:-uniqchat_secret}@postgres:5432/uniqchat?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_change_in_production_32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-refreshsecretkey_change_in_production_32ch}
      FRONTEND_URL: ${FRONTEND_URL:-https://uniq.chat}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_DIR: /app/sessions
      PROXY_ENCRYPTION_KEY: ${PROXY_ENCRYPTION_KEY:-12345678901234567890123456789012}
      # RabbitMQ — fila interna (anti-ban + serialização por instância)
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-uniqchat}:${RABBITMQ_PASS:-uniqchat123}@rabbitmq:5672/
      # MinIO — armazenamento de mídia
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-uniqchat}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-uniqchat123}
      MINIO_BUCKET: ${MINIO_BUCKET:-uniqchat-media}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-https://media.uniq.chat}
      MINIO_USE_SSL: "false"
    volumes:
      - sessions_data:/app/sessions
    ports:
      - "8080:8080"

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uniqchat-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.uniq.chat}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-nextauthsecret_change_in_production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://uniq.chat}
    ports:
      - "3010:3000"

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  sessions_data:
