# Dokploy compose — white-label.
# Toda configuração específica do cliente vem do .env. Defaults sensatos para
# permitir `docker compose up -d` em dev sem editar nada.
#
# Para múltiplas instâncias no mesmo host Dokploy: setar STACK_NAME diferente
# em cada projeto (default = "uniq"). Os container_name viram ${STACK_NAME}-*
# e não colidem.

services:

  postgres:
    image: postgres:16-alpine
    container_name: ${STACK_NAME:-uniq}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uniqchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-uniqchat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uniqchat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ${STACK_NAME:-uniq}-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-uniqchat}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  instagram-bridge:
    build:
      context: ./instagram-bridge
      dockerfile: Dockerfile
    container_name: ${STACK_NAME:-uniq}-instagram-bridge
    restart: unless-stopped
    environment:
      INSTAGRAM_BRIDGE_PORT: 8091
      INSTAGRAM_BRIDGE_SESSIONS_DIR: /app/sessions
    volumes:
      - instagram_sessions:/app/sessions
    networks:
      - dokploy-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${STACK_NAME:-uniq}-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      instagram-bridge:
        condition: service_started
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-uniqchat}:${POSTGRES_PASSWORD}@${STACK_NAME:-uniq}-postgres:5432/${POSTGRES_DB:-uniqchat}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      APP_URL: ${APP_URL}
      APP_NAME: ${APP_NAME:-Uniq}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_DIR: /app/sessions
      PROXY_ENCRYPTION_KEY: ${PROXY_ENCRYPTION_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-uniqchat}:${RABBITMQ_PASS}@${STACK_NAME:-uniq}-rabbitmq:5672/
      # Storage S3-compatible (Hetzner / R2 / S3 / MinIO).
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-true}
      # White-label bootstrap.
      BOOTSTRAP_ON_START: ${BOOTSTRAP_ON_START:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      SUPER_ADMIN_EMAIL: ${ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SUPER_ADMIN_NAME: ${ADMIN_NAME:-Admin}
      INSTAGRAM_BASE_URL: http://${STACK_NAME:-uniq}-instagram-bridge:8091
      # Stripe (opcional — só usado se NEXT_PUBLIC_ENABLE_BILLING=true).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}
      # Meta WhatsApp Cloud API (opcional).
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WHATSAPP_CONFIG_ID: ${META_WHATSAPP_CONFIG_ID:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
    volumes:
      - sessions_data:/app/sessions
    expose:
      - "8080"
    networks:
      - dokploy-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* são build-time no Next.js.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_META_APP_ID: ${META_APP_ID:-}
        NEXT_PUBLIC_META_WHATSAPP_CONFIG_ID: ${META_WHATSAPP_CONFIG_ID:-}
        # Feature flags do white-label.
        NEXT_PUBLIC_ENABLE_SHOPS: ${NEXT_PUBLIC_ENABLE_SHOPS:-false}
        NEXT_PUBLIC_ENABLE_HELPDESK: ${NEXT_PUBLIC_ENABLE_HELPDESK:-false}
        NEXT_PUBLIC_ENABLE_BILLING: ${NEXT_PUBLIC_ENABLE_BILLING:-false}
        NEXT_PUBLIC_ENABLE_USAGE: ${NEXT_PUBLIC_ENABLE_USAGE:-false}
    container_name: ${STACK_NAME:-uniq}-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${FRONTEND_URL}
      API_URL: http://${STACK_NAME:-uniq}-backend:8080
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    expose:
      - "3000"
    networks:
      - dokploy-network

volumes:
  postgres_data:
  rabbitmq_data:
  sessions_data:
  instagram_sessions:

# dokploy-network é a rede externa do Dokploy/Traefik. Domínios e SSL são
# configurados pelo painel do Dokploy apontando para os serviços `frontend`
# (porta 3000) e `backend` (porta 8080).
networks:
  dokploy-network:
    external: true
